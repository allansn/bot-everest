

name: BOT EVEREST

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verificar-clan:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar BOT EVEREST
        env:
          CLASH_API_TOKEN: ${{ secrets.CLASH_API_TOKEN }}
        run: python bot.py

      - name: Salvar histórico dos membros
        run: |
          git config user.name "BOT EVEREST"
          git config user.email "bot-everest@users.noreply.github.com"
          git add membros.json alertas_whatsapp.txt
          if ! git diff --cached --quiet; then
            git commit -m "Atualizar histórico de membros"
            git push
          else
            echo "Nenhuma alteração no histórico."
          fi
